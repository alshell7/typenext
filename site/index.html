<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TypeNext · A local-first Markdown notepad</title>
    <meta
      name="description"
      content="TypeNext is a free, open-source, local-first Markdown notepad for Windows and macOS. You write; a suggestion at the cursor helps you continue, and Tab accepts it. Your notes stay on your device."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f6f2" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161718" media="(prefers-color-scheme: dark)" />
    <link rel="canonical" href="https://alshell7.github.io/typenext/" />
    <link rel="icon" type="image/png" href="/assets/Icon.png" />
    <link rel="apple-touch-icon" href="/assets/Icon512.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="TypeNext" />
    <meta property="og:title" content="TypeNext · Your words. A little room to keep going." />
    <meta
      property="og:description"
      content="A free, local-first Markdown notepad. You write; a suggestion at the cursor helps you continue. Notes stay on your device."
    />
    <meta property="og:url" content="https://alshell7.github.io/typenext/" />
    <meta property="og:image" content="https://alshell7.github.io/typenext/assets/writing-light.png" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="960" />
    <meta property="og:image:alt" content="The TypeNext writing space with a Markdown note and a faint suggestion at the cursor." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="TypeNext · Your words. A little room to keep going." />
    <meta
      name="twitter:description"
      content="A free, local-first Markdown notepad. You write; a suggestion at the cursor helps you continue."
    />
    <meta name="twitter:image" content="https://alshell7.github.io/typenext/assets/writing-light.png" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "TypeNext",
        "applicationCategory": "ProductivityApplication",
        "operatingSystem": "Windows, macOS",
        "description": "A local-first Markdown notepad with suggestions at the cursor.",
        "license": "https://opensource.org/license/mit",
        "url": "https://alshell7.github.io/typenext/",
        "downloadUrl": "https://github.com/alshell7/typenext/releases/latest",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
      }
    </script>

    <script>
      // Apply a saved theme before the first paint. Without one, CSS follows the system.
      try {
        var saved = localStorage.getItem('typenext-site-theme')
        if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 640px; margin: 64px auto; padding: 0 16px; font-family: system-ui, sans-serif; line-height: 1.6">
        <h1>TypeNext</h1>
        <p>A free, local-first Markdown notepad for Windows and macOS. You write; a suggestion at the cursor helps you continue.</p>
        <p>
          <a href="https://github.com/alshell7/typenext/releases/latest">Download TypeNext</a> ·
          <a href="https://github.com/alshell7/typenext">Source on GitHub</a>
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
