name: Release TypeNext

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release tag, for example v0.1.1'
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  TYPENEXT_LIVE_OPENROUTER: '0'
  TYPENEXT_DEMO_OPENROUTER: '0'
  TYPENEXT_LIVE_DRY_RUN: '0'
  TYPENEXT_DEMO_OPENROUTER_DRY_RUN: '0'
  TYPENEXT_NATIVE_AI_SMOKE: '0'

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.metadata.outputs.tag }}
      version: ${{ steps.metadata.outputs.version }}
      commit: ${{ steps.metadata.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.version || github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate exact tag, MIT metadata, notices and bundle resources
        id: metadata
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: node scripts/release/validate-tag.mjs
      - name: Verify original master and every desktop icon derivative
        run: node scripts/verify-brand.mjs
      - name: Check release gate helpers
        run: node --test scripts/release/*.test.mjs tests/native/shutdown.test.mjs

  frontend:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:run
      - run: python3 -m unittest discover -s training -p 'test_*.py'
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Offline browser regressions, including sample context and replay
        run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: release-browser-test-failures
          path: test-results
          retention-days: 7

  build:
    needs: prepare
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows-x64
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          - os: macos-15
            platform: macos-arm64
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            platform: macos-x64
            target: x86_64-apple-darwin
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable action
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri -> target
          key: release-${{ matrix.target }}
      - run: npm ci
      - name: Frontend unit tests on this operating system
        run: npm run test:run
      - name: Verify clean-exit shutdown harness on this operating system
        run: node --test tests/native/shutdown.test.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Native tests on the matching Windows or Mac architecture
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }} --all-targets -- -D warnings
      - name: Collect licenses of the actual target's resolved native crates
        run: node scripts/release/collect-rust-notices.mjs ${{ matrix.target }}
      - name: Isolated Windows WebView2 and crash/restart smoke
        if: runner.os == 'Windows'
        run: npm run test:native:windows
      - name: Build installers and application bundle
        env:
          # Ad-hoc signatures are required for usable unsigned Apple Silicon
          # bundles. Developer ID notarization is a separate documented setup.
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri:build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Verify native architecture and stage complete licensed assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/release/stage-artifacts.mjs ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: artifacts/release/${{ matrix.platform }}/upload/
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [prepare, frontend, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: artifacts/release-downloads
      - name: Require all three platforms, exact commit/version and SHA-256
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/release/verify-artifacts.mjs
      - name: Upload every asset to a draft, verify remote digests, then publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit }}
        run: node scripts/release/publish.mjs
