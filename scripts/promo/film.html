<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TypeNext film</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #f4f3ef;
        --dim: #8b8a85;
        --ghost: #7a7975;
        --mint: #a6e3b8;
        --green: #42644d;
        --deep: #060807;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--deep);
        color: var(--ink);
        font-family: 'Inter Tight', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #bg,
      #world,
      .layer,
      #flash,
      #vignette,
      #grain {
        position: absolute;
        inset: 0;
      }
      #bg {
        background:
          radial-gradient(60% 55% at var(--gx, 30%) var(--gy, 30%), rgb(66 100 77 / var(--ga, 0.22)), transparent 70%),
          radial-gradient(50% 50% at var(--hx, 75%) var(--hy, 80%), rgb(40 70 90 / var(--ha, 0.16)), transparent 70%),
          var(--deep);
      }
      #world {
        transform-origin: 50% 50%;
      }
      .layer {
        display: none;
        perspective: 2600px;
      }
      .center {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        white-space: nowrap;
      }
      .display {
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
      }
      .serif {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      .char {
        display: inline-block;
        white-space: pre;
      }
      .caret {
        position: absolute;
        width: 9px;
        background: var(--ink);
        border-radius: 1px;
      }
      .strike {
        position: absolute;
        height: 7px;
        background: var(--ink);
        border-radius: 4px;
        transform-origin: 0 50%;
      }
      .keycap {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 150px;
        height: 92px;
        padding: 0 30px;
        border-radius: 22px;
        font: 600 44px/1 'JetBrains Mono', monospace;
        color: var(--ink);
        background: linear-gradient(#2a2c2a, #171817);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 18%),
          0 10px 0 #0c0d0c,
          0 18px 40px rgb(0 0 0 / 55%);
        vertical-align: middle;
      }
      .window {
        position: absolute;
        left: 0;
        top: 0;
        overflow: hidden;
        border-radius: 22px;
        background: #fff;
        box-shadow:
          0 0 0 1px rgb(255 255 255 / 10%),
          0 50px 140px rgb(0 0 0 / 65%),
          0 20px 50px rgb(0 0 0 / 45%);
        transform-style: preserve-3d;
      }
      .window .content {
        position: absolute;
        left: 0;
        top: 0;
        width: 2560px;
        height: 1600px;
        transform-origin: 0 0;
      }
      .window img {
        display: block;
        width: 2560px;
        height: 1600px;
      }
      .window .glow {
        position: absolute;
        border-radius: 18px;
        pointer-events: none;
      }
      .window .sheen {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / 9%) 50%, transparent 65%);
      }
      .caption {
        font-weight: 700;
        font-size: 64px;
        letter-spacing: -0.035em;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        padding: 18px 30px;
        border-radius: 999px;
        border: 1px solid rgb(255 255 255 / 14%);
        background: rgb(255 255 255 / 6%);
        backdrop-filter: blur(14px);
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .tile {
        position: absolute;
        width: 150px;
        height: 150px;
        margin: -75px 0 0 -75px;
        border-radius: 36px;
        display: grid;
        place-items: center;
        background: linear-gradient(160deg, rgb(255 255 255 / 14%), rgb(255 255 255 / 4%));
        border: 1px solid rgb(255 255 255 / 16%);
        box-shadow: 0 24px 60px rgb(0 0 0 / 50%);
      }
      .tile svg {
        width: 74px;
        height: 74px;
        stroke: var(--ink);
        stroke-width: 2.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .core {
        position: absolute;
        left: 960px;
        top: 540px;
        transform: translate(-50%, -50%);
        padding: 34px 56px;
        border-radius: 40px;
        background: linear-gradient(150deg, #213428, #0e1511);
        border: 1px solid rgb(166 227 184 / 35%);
        box-shadow:
          0 0 120px rgb(166 227 184 / 30%),
          inset 0 1px 0 rgb(255 255 255 / 15%);
        text-align: center;
        white-space: nowrap;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 28px;
        font-size: 50px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .check svg {
        width: 54px;
        height: 54px;
        flex: none;
        stroke: var(--mint);
        stroke-width: 3.4;
        fill: none;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .label {
        position: absolute;
        left: 230px;
        bottom: 110px;
        font-weight: 800;
        font-size: 150px;
        letter-spacing: -0.05em;
        line-height: 1;
        text-shadow: 0 10px 60px rgb(0 0 0 / 70%);
      }
      #flash {
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #vignette {
        background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgb(0 0 0 / 55%) 100%);
        pointer-events: none;
      }
      #grain {
        opacity: 0.075;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bg"></div>
      <div id="world"></div>
      <div id="flash"></div>
      <div id="vignette"></div>
      <canvas id="grain" width="960" height="540"></canvas>
    </div>
    <script type="module" src="./film.js"></script>
  </body>
</html>
