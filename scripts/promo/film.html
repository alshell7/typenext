<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>TypeNext film</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@500;600&display=block"
      rel="stylesheet"
    />
    <!-- Pinned versions: three 0.169.0 (2024-09) and lottie-web 5.12.2. -->
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/lottie-web@5.12.2/build/player/lottie_svg.min.js"></script>
    <style>
      :root {
        --ink: #f4f3ef;
        --dim: #8b8a85;
        --ghost: #7a7975;
        --mint: #a6e3b8;
        --deep: #050706;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #stage {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--deep);
        color: var(--ink);
        font-family: 'Inter Tight', system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      #gl,
      #world,
      #overlay,
      .layer,
      #flash,
      #vignette,
      #grain {
        position: absolute;
        inset: 0;
      }
      #gl {
        width: 1920px;
        height: 1080px;
      }
      #world {
        transform-origin: 50% 50%;
      }
      .layer {
        display: none;
        perspective: 2600px;
        transform-style: preserve-3d;
      }
      .center {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        white-space: nowrap;
      }
      .display {
        font-weight: 800;
        letter-spacing: -0.045em;
        line-height: 1;
        transform-origin: 50% 70%;
      }
      .serif {
        font-family: 'Instrument Serif', Georgia, serif;
        font-style: italic;
        font-weight: 400;
        letter-spacing: -0.01em;
      }
      .mono {
        font-family: 'JetBrains Mono', ui-monospace, monospace;
      }
      .char {
        display: inline-block;
        white-space: pre;
      }
      .caret {
        position: absolute;
        width: 9px;
        background: var(--ink);
        border-radius: 1px;
        box-shadow: 0 0 18px rgb(244 243 239 / 45%);
      }
      .strike {
        position: absolute;
        height: 7px;
        background: var(--ink);
        border-radius: 4px;
        transform-origin: 0 50%;
      }
      /* A keycap with real depth: the top face sits on a lit side. */
      .keycap {
        display: inline-block;
        margin-left: 52px;
        vertical-align: middle;
        transform-style: preserve-3d;
        --press: 0;
      }
      .keycap-top {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 158px;
        height: 96px;
        padding: 0 32px;
        border-radius: 22px;
        font: 600 44px/1 'JetBrains Mono', monospace;
        color: var(--ink);
        background: linear-gradient(#2e312e, #191a19);
        box-shadow:
          inset 0 1px 0 rgb(255 255 255 / 20%),
          0 calc(12px - 9px * var(--press)) 0 #0b0c0b,
          0 calc(13px - 9px * var(--press)) 0 #2a3a30,
          0 24px 44px rgb(0 0 0 / 55%),
          0 0 calc(80px * var(--press)) rgb(166 227 184 / 60%);
        transform: translateY(calc(9px * var(--press)));
      }
      /* Real app windows: a screen, a slab behind it, and a floor reflection. */
      .window {
        position: absolute;
        left: 0;
        top: 0;
        transform-style: preserve-3d;
        -webkit-box-reflect: below 26px linear-gradient(transparent 76%, rgb(255 255 255 / 13%));
      }
      .window .slab {
        position: absolute;
        inset: 6px;
        border-radius: 24px;
        background: linear-gradient(160deg, #26302a, #0d110f);
        transform: translateZ(-34px);
        box-shadow: 0 60px 140px rgb(0 0 0 / 70%);
      }
      .window .screen {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 22px;
        background: #fff;
        box-shadow:
          0 0 0 1px rgb(255 255 255 / 12%),
          0 30px 90px rgb(0 0 0 / 55%);
      }
      .window .content {
        position: absolute;
        left: 0;
        top: 0;
        width: 2560px;
        height: 1600px;
        transform-origin: 0 0;
      }
      .window img {
        display: block;
        width: 2560px;
        height: 1600px;
      }
      .window .glow {
        position: absolute;
        border-radius: 18px;
        pointer-events: none;
      }
      .window .sheen {
        position: absolute;
        inset: 0;
        pointer-events: none;
        background: linear-gradient(115deg, transparent 35%, rgb(255 255 255 / 10%) 50%, transparent 65%);
      }
      .lower-third {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46%;
        background: linear-gradient(to top, rgb(5 7 6 / 88%), rgb(5 7 6 / 50%) 45%, transparent);
        pointer-events: none;
      }
      .caption {
        font-weight: 700;
        font-size: 64px;
        letter-spacing: -0.035em;
        text-shadow: 0 6px 30px rgb(0 0 0 / 60%);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 18px;
        padding: 18px 30px;
        border-radius: 999px;
        border: 1px solid rgb(255 255 255 / 14%);
        background: rgb(255 255 255 / 7%);
        backdrop-filter: blur(14px);
        font-size: 34px;
        font-weight: 500;
        letter-spacing: -0.01em;
      }
      .core-chip {
        position: absolute;
        left: 960px;
        top: 868px;
        transform: translate(-50%, -50%);
        padding: 26px 48px;
        border-radius: 34px;
        background: linear-gradient(150deg, rgb(33 52 40 / 82%), rgb(14 21 17 / 82%));
        border: 1px solid rgb(166 227 184 / 38%);
        box-shadow:
          0 0 90px rgb(166 227 184 / 26%),
          inset 0 1px 0 rgb(255 255 255 / 16%);
        backdrop-filter: blur(16px);
        text-align: center;
        white-space: nowrap;
      }
      .core-title {
        font-size: 70px;
        font-weight: 700;
        letter-spacing: -0.04em;
      }
      .core-sub {
        margin-top: 10px;
        font-size: 34px;
        font-weight: 500;
        color: var(--mint);
      }
      .meter {
        position: absolute;
        left: 960px;
        top: 1012px;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 96px;
        padding: 0 40px 0 18px;
        border-radius: 999px;
        background: rgb(10 12 11 / 84%);
        border: 1px solid rgb(255 255 255 / 12%);
        box-shadow: 0 20px 60px rgb(0 0 0 / 55%);
        transform: translate(-50%, -50%);
      }
      .meter-mic {
        flex: none;
        margin: -12px 6px -12px -6px;
      }
      .meter-bar {
        width: 7px;
        border-radius: 4px;
        background: var(--mint);
      }
      .stage-lottie {
        position: absolute;
        pointer-events: none;
      }
      .checklist {
        position: absolute;
        left: 450px;
        top: 432px;
        display: grid;
        gap: 34px;
        perspective: 1200px;
      }
      .check {
        display: flex;
        align-items: center;
        gap: 24px;
        font-size: 50px;
        font-weight: 600;
        letter-spacing: -0.03em;
      }
      .check-lottie {
        flex: none;
      }
      .label {
        position: absolute;
        left: 230px;
        bottom: 104px;
        font-weight: 800;
        font-size: 150px;
        letter-spacing: -0.05em;
        line-height: 1;
        transform-origin: 0 80%;
      }
      .wordmark {
        position: absolute;
        top: 392px;
        font-size: 196px;
        font-weight: 700;
        letter-spacing: -0.045em;
        line-height: 1;
        white-space: nowrap;
        perspective: 900px;
        text-shadow: 0 12px 50px rgb(0 0 0 / 60%);
      }
      #flash {
        background: #fff;
        opacity: 0;
        pointer-events: none;
      }
      #vignette {
        background: radial-gradient(120% 90% at 50% 50%, transparent 55%, rgb(0 0 0 / 58%) 100%);
        pointer-events: none;
      }
      #grain {
        opacity: 0.06;
        mix-blend-mode: overlay;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="gl" width="1920" height="1080"></canvas>
      <div id="world"></div>
      <div id="overlay"></div>
      <div id="flash"></div>
      <div id="vignette"></div>
      <canvas id="grain" width="960" height="540"></canvas>
    </div>
    <script type="module" src="./film.js"></script>
  </body>
</html>
